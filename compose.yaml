services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: wharf_hotel
      POSTGRES_USER: wharf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wharf_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wharf -d wharf_hotel"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  wharf_postgres:
